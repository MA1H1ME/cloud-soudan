# 仕様書「13. 最初のシナリオ3本」シナリオ1
# 状態：下書き（公式ドキュメントとは未照合）
# 照合が必要な事実：
#   - S3ウェブサイトエンドポイントはHTTPSに対応していない
#   - CloudFrontのオリジンアクセスコントロール（OAC）で、バケットを非公開のままにできる
#   - S3とEC2の課金の考え方（保存量・転送量／起動時間）
id: akari-01
kind: story
customerId: akari
chapter: 1
title: 旅ブログを、ランチ1回分で
weights: { security: 0.10, reliability: 0.15, performance: 0.15, cost: 0.45, operations: 0.15 }
requirements:
  - id: https
    text: 独自ドメインでHTTPS配信できること
intros:
  - lines:
      - { speaker: customer, text: 'はじめまして！ 旅のブログを自分のドメインで公開したくて。記事は文章と写真だけです' }
      - { speaker: customer, text: '副業なので、毎月の費用はランチ1回分に収めたいんです。あ、アドレスバーの鍵マークは出したいです。読者さんに怪しまれたくないので' }
      - { speaker: senpai, text: 'サーバー側で動かす処理はなさそうだね。で、お客さんは何を一番守りたいんだっけ？' }
decisions:
  - id: hosting
    conceptId: static-site-delivery
    prompt: ブログをどこに置いて、どう配信する？
    hint: 文章と写真だけのサイトに、サーバーを常に動かしておく必要はあるかな？
    examPoint: 「静的コンテンツ」「運用負荷を最小に」「低コスト」が並んだら、S3＋CloudFrontが第一候補。
    options:
      - id: ec2-single
        label: EC2を1台立ててWebサーバーを入れる
        services: [ec2]
        scores: { security: 3, reliability: 2, performance: 3, cost: 3, operations: 2 }
        scoreNotes:
          cost: 起動している間ずっと料金がかかる
          operations: OSの更新を自分で行う
        setFlags: { akari.hosting: ec2-single }
        reaction:
          - { speaker: customer, mood: troubled, text: '公開できました！ ただ、誰も見ていない夜中も料金がかかるんですね…' }
        explanation: EC2は起動している間ずっと料金がかかり、OSの更新も自分で行います。静的サイトには手間も費用も見合いません。
      - id: s3-website
        label: S3の静的ウェブサイトホスティングだけで公開する
        services: [s3, s3-website]
        scores: { security: 2, reliability: 4, performance: 3, cost: 5, operations: 4 }
        violates: [https]
        misconception: s3-website-https
        setFlags: { akari.hosting: s3-website }
        reaction:
          - { speaker: customer, mood: troubled, text: '安い！ …あれ、鍵マークが出ないって読者さんに言われちゃいました' }
        explanation: S3のウェブサイトエンドポイントはHTTPSに対応していません。HTTPSで配信するにはCloudFrontを前段に置きます。
      - id: s3-cloudfront
        label: S3に置き、CloudFront経由で配信する（バケットは非公開）
        services: [s3, cloudfront]
        scores: { security: 4, reliability: 5, performance: 5, cost: 4, operations: 4 }
        setFlags: { akari.hosting: s3-cloudfront }
        reaction:
          - { speaker: customer, mood: happy, text: '鍵マークも出るし、表示も速い。これでランチ以下ですか！' }
        explanation: 静的なファイルはS3に置けばサーバー管理が要りません。CloudFrontでHTTPS配信し、OACでバケットを非公開に保てます。
      - id: alb-ec2
        label: ロードバランサーを置き、2つのAZにEC2を並べる
        services: [alb, ec2]
        scores: { security: 3, reliability: 4, performance: 3, cost: 1, operations: 2 }
        setFlags: { akari.hosting: alb-ec2 }
        reaction:
          - { speaker: customer, mood: troubled, text: '立派ですけど…見積もり、ランチ何回分ですか？' }
        explanation: 可用性は上がりますが、静的サイトには過剰です。ロードバランサーと複数台のEC2の費用が常にかかります。
outro:
  - { speaker: senpai, text: '優先度が違っても、この相談の答えは変わらない。答えが変わるのは前提が変わるときだよ' }
unlocks: []
sources: []
review:
  status: draft
