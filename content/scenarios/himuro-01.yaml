# 仕様書「13. 最初のシナリオ3本」シナリオ3
# 状態：下書き（公式ドキュメントとは未照合）
# 照合が必要な事実：
#   - バケットのデフォルトの公開設定とブロックパブリックアクセス
#   - 署名付きURLの権限の考え方と有効期限の上限
#   - IAMロールによる一時的な認証情報の供給
#   - IAMユーザー数の上限
# 医療情報に関する法令・ガイドラインへの適合はこのゲームでは扱わない（設定は架空）。
id: himuro-01
kind: story
customerId: himuro
chapter: 1
title: 検査結果を、本人にだけ
weights: { security: 0.45, reliability: 0.15, performance: 0.10, cost: 0.15, operations: 0.15 }
requirements:
  - id: patient-only
    text: 本人以外が検査結果を閲覧できないこと
  - id: no-long-term-credentials
    text: サーバーに長期の認証情報を保存しないこと
intros:
  - lines:
      - { speaker: customer, text: '患者さんがアプリにログインして、自分の検査結果のPDFをダウンロードできるようにしたいんです' }
      - { speaker: customer, text: '言うまでもなく、本人以外に見えてはいけません。それと、導入先の審査では『サーバーに認証情報を置きっぱなしにしていないか』を必ず聞かれます' }
      - { speaker: customer, text: '費用や速度は二の次です。根拠を説明できる構成にしてください' }
decisions:
  - id: share
    conceptId: s3-private-access
    prompt: 患者さんにPDFをどう渡す？
    hint: 「URLを知っていれば誰でも開ける」は、本人だけと言えるかな？
    examPoint: 「一時的に」「特定のオブジェクトだけ」「バケットは非公開のまま」なら署名付きURL。
    options:
      - id: public-bucket
        label: バケットを公開し、推測されにくい長いファイル名にする
        services: [s3]
        scores: { security: 0, reliability: 4, performance: 4, cost: 5, operations: 4 }
        violates: [patient-only]
        setFlags: { himuro.share: public-bucket }
        reaction:
          - { speaker: customer, mood: troubled, text: '…URLを知っていれば誰でも開ける、ということですよね？' }
        explanation: 推測されにくい名前はアクセス制御ではありません。バケットは非公開のまま、ブロックパブリックアクセスも有効にしておきます。
      - id: presigned-url
        label: バケットは非公開のまま、ログイン済みの本人にだけ、有効期限の短い署名付きURLをアプリが発行する
        services: [s3, s3-presigned-url]
        scores: { security: 5, reliability: 4, performance: 4, cost: 5, operations: 4 }
        setFlags: { himuro.share: presigned-url }
        reaction:
          - { speaker: customer, mood: happy, text: '期限が切れれば使えなくなる。審査でそのまま説明できます' }
        explanation: 署名付きURLは特定のオブジェクトへのアクセスを期限付きで許可します。期限内はURLを持つ人がアクセスできるため、ログインを確認してから都度発行し、期限を短くします。
      - id: iam-users
        label: 患者さんごとにIAMユーザーを作り、認証情報を配る
        services: [s3, iam-user]
        scores: { security: 2, reliability: 3, performance: 3, cost: 4, operations: 0 }
        setFlags: { himuro.share: iam-users }
        reaction:
          - { speaker: customer, mood: troubled, text: '患者さんが増えるたびに、誰がそれを管理するんですか' }
        explanation: IAMユーザーは作業者やシステムのためのもので、アプリの利用者を管理する仕組みではありません。
      - id: proxy
        label: アプリのサーバーがS3からPDFを読み出し、自分で患者さんに返す
        services: [s3, ec2]
        scores: { security: 5, reliability: 3, performance: 3, cost: 4, operations: 3 }
        setFlags: { himuro.share: proxy }
        reaction:
          - { speaker: customer, text: '安全ですね。ただ、ダウンロードが集中するとサーバーが重くなりませんか' }
        explanation: 安全ですが、ファイルの転送がすべてサーバーを通ります。性能を優先するお客さんなら署名付きURLとの差がさらに開きます。
  - id: credential
    conceptId: ec2-iam-role
    prompt: アプリ（EC2）に、S3へのアクセス権をどう与える？
    hint: 審査で聞かれるのは「認証情報を置きっぱなしにしていないか」だったね
    examPoint: 「EC2上のアプリからAWSのサービスを使う」ならIAMロール。アクセスキーを埋め込む選択肢は誤答として置かれる。
    options:
      - id: access-key
        label: IAMユーザーのアクセスキーを発行し、アプリの設定ファイルに書く
        services: [ec2, iam-user]
        scores: { security: 1, reliability: 3, performance: 3, cost: 5, operations: 2 }
        violates: [no-long-term-credentials]
        setFlags: { himuro.credential: access-key }
        reaction:
          - { speaker: customer, mood: troubled, text: 'それが、審査で必ず指摘される構成です' }
        explanation: アクセスキーは長期の認証情報で、漏れると取り消すまで使われ続けます。
      - id: role-scoped
        label: EC2にIAMロールを割り当て、該当バケットに必要な操作だけを許可する
        services: [ec2, iam-role]
        scores: { security: 5, reliability: 4, performance: 3, cost: 5, operations: 5 }
        setFlags: { himuro.credential: role-scoped }
        reaction:
          - { speaker: customer, mood: happy, text: 'キーを置かない、権限も絞る。文句ありません' }
        explanation: EC2にIAMロールを割り当てると、一時的な認証情報が自動で渡され、更新されます。権限は必要なバケットと操作だけに絞ります（最小権限）。
      - id: role-full
        label: EC2にIAMロールを割り当て、S3のフルアクセスを許可する
        services: [ec2, iam-role]
        scores: { security: 3, reliability: 4, performance: 3, cost: 5, operations: 4 }
        setFlags: { himuro.credential: role-full }
        reaction:
          - { speaker: customer, text: 'キーがないのは良い。でも、関係ないバケットまで触れるのはなぜですか' }
        explanation: キーを置かない点は正しいですが、フルアクセスは侵入されたときの被害範囲を広げます。
outro:
  - { speaker: senpai, text: '氷室さんは根拠を聞いてくる。どの判断も、試験の解説と同じ言葉で説明できるようにしておこう' }
unlocks: []
sources: []
review:
  status: draft
