  business: 写真館の撮影予約サイト
  voice: 七五三の時期は予約が止まると致命的なんです。データベースが故障しても、数分で戻るようにできますか？
  goal: データベースの障害があっても、稼働率 99.5% 以上
  plan: { visitsPerDay: 600, budget: 30000, uptimeTarget: 0.995, events: [{ day: 10, type: db-failure, label: データベースの障害 }] }
  start: { slots: { public: null, app-a: ec2, app-c: null, data-a: rds, data-c: null }, backup: true, autoScaling: false }
  options:
    - { id: standby, label: マルチ AZ にする（スタンバイを追加）, patch: { slots: { data-c: rds-standby } } }
    - { id: replica, label: 別のAZにリードレプリカを追加, patch: { slots: { data-c: rds-replica } } }
    - { id: none, label: 自動バックアップがあるので、このままにする, patch: {} }
