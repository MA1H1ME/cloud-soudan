# ルール＝知識の単位。「構成のパターン × 出来事 → 何が起きるか」。仕様書16章
# すべて下書き（公式ドキュメントとは未照合）。照合したら sources と review を埋める。
- id: db-multi-az
  conceptId: rds-multiaz-vs-read-replica
  tone: good
  headline: 待機系に自動で切り替わり、ほとんど止まらなかった
  explanation: マルチAZ配置では、別のAZにある待機系へ同期的に複製しています。本体に障害が起きると、自動で待機系に切り替わります。
  examPoint: 「高可用性」「自動フェイルオーバー」と書かれていたら、RDSのマルチAZ配置。
  review: { status: draft }
- id: db-replica-manual
  conceptId: rds-multiaz-vs-read-replica
  tone: bad
  headline: リードレプリカは自動では切り替わらず、手動で昇格させるまで止まった
  explanation: リードレプリカは読み取りの負荷を分散するためのもので、複製は非同期です。本体が止まっても自動では切り替わらず、昇格は手動の操作になります。
  examPoint: 可用性を上げる目的でリードレプリカを選ばせる選択肢は、誤答として置かれる。
  ticket: { kind: incident, voice: 予備のデータベースがあるのに、どうして止まったんですか？ }
  review: { status: draft }
- id: db-single-backup
  conceptId: rds-backup-restore
  tone: bad
  headline: バックアップからの復元が終わるまで、サイトが止まった
  explanation: 自動バックアップがあれば、記録を失わずに復元できます。ただし復元は新しいデータベースを作り直す作業で、その間は止まります。バックアップは「記録」を守りますが、「止まらないこと」は守りません。
  examPoint: 「データを失わない」はバックアップ、「止まらない」はマルチAZ。求められているのがどちらかを読み分ける。
  ticket: { kind: incident, voice: 先月、半日ほど注文が取れませんでした。記録は無事でしたが… }
  review: { status: draft }
- id: db-no-backup
  conceptId: rds-backup-restore
  tone: bad
  headline: バックアップがなく、注文の記録を失った
  explanation: 自動バックアップを切っていると、障害のときに戻せる時点がありません。止まるだけでなく、記録そのものを失います。
  examPoint: データを守る要件があるのに、バックアップのない構成は選べない。
  ticket: { kind: incident, voice: 注文の記録が消えました。お客さん一人ひとりに連絡して謝っています }
  review: { status: draft }
- id: web-single-overload
  conceptId: ec2-scaling-and-load-balancing
  tone: bad
  headline: サーバー1台では受けきれず、買えないお客さんが出た
  explanation: 1台のサーバーには処理できる量の上限があります。台数を増やして振り分ける（ALB）か、負荷に応じて自動で台数を増やす（Auto Scaling）必要があります。
  examPoint: 「アクセスが増えると遅くなる」には、ALBとAuto Scalingで横に増やす構成が基本。
  ticket: { kind: performance, voice: セールのとき、重くて買えなかったという声が届いています }
  review: { status: draft }
- id: web-fixed-overload
  conceptId: ec2-scaling-and-load-balancing
  tone: bad
  headline: 台数が固定のままで、急なアクセス増に追いつけなかった
  explanation: 台数を固定で増やしても、想定を超える急増には足りません。Auto Scalingなら、負荷が上がったときだけ台数を増やせます。
  examPoint: 「予測できない急増」「必要なときだけ」と書かれていたら、Auto Scaling。
  ticket: { kind: performance, voice: テレビの放送直後、サイトがつながりにくかったそうです }
  review: { status: draft }
- id: asg-scale-out
  conceptId: ec2-scaling-and-load-balancing
  tone: good
  headline: Auto Scaling が台数を増やし、アクセス増をさばいた
  explanation: Auto Scalingは負荷に応じてサーバーの台数を増減します。増えた分の料金は、動いていた間だけかかります。
  examPoint: 常に多めの台数を用意するより、必要なときだけ増やすほうがコストを抑えられる。
  review: { status: draft }
- id: web-alb-spread
  conceptId: ec2-scaling-and-load-balancing
  tone: good
  headline: ALB が2台に振り分け、1台では受けきれない量をさばいた
  explanation: ALBは届いたアクセスを複数のサーバーに振り分けます。1台あたりの負荷が下がり、全体でさばける量が増えます。
  examPoint: 複数のサーバーにアクセスを分散させる役割は、ロードバランサー。
  review: { status: draft }
- id: web-single-az-outage
  conceptId: multi-az-web-tier
  tone: bad
  headline: サーバーが片方のAZにしかなく、AZの障害でサイトごと止まった
  explanation: AZは独立した設備の単位です。すべてのサーバーを1つのAZに置くと、そのAZの障害で全体が止まります。2つ以上のAZに置き、ALBで振り分けます。
  examPoint: 「単一障害点をなくす」には、複数のAZへの配置とロードバランサーの組み合わせ。
  ticket: { kind: incident, voice: 障害の間、サイトがまったく開きませんでした。止めないでほしいとお願いしたはずです }
  review: { status: draft }
- id: web-multi-az-survive
  conceptId: multi-az-web-tier
  tone: good
  headline: もう一方のAZのサーバーが受け続け、サイトは止まらなかった
  explanation: サーバーを2つのAZに置き、ALBで振り分けていたので、片方のAZに障害が起きても、残ったAZのサーバーにアクセスが届きました。
  examPoint: Web層の高可用性は、複数のAZ＋ロードバランサー。
  review: { status: draft }
- id: web-second-without-alb
  conceptId: ec2-scaling-and-load-balancing
  tone: bad
  headline: 振り分ける装置がなく、2台目のサーバーは使われないまま料金だけかかった
  explanation: サーバーを増やすだけでは、アクセスは2台目に届きません。前段にALBを置いて、はじめて振り分けられます。
  examPoint: サーバーを複数台にするときは、ロードバランサーとセットで考える。
  ticket: { kind: billing, voice: サーバーを2台にしたと聞きましたが、速くなった気がしません。料金は増えていますよね？ }
  review: { status: draft }
- id: alb-single-ec2
  conceptId: ec2-scaling-and-load-balancing
  tone: bad
  headline: ALB の後ろにサーバーが1台だけで、振り分ける相手がいなかった
  explanation: ALBは複数のサーバーに振り分けるための装置です。後ろが1台だけで、Auto Scalingも使っていなければ、費用が増えるだけです。
  examPoint: 部品は役割が生きる組み合わせで置く。使われない部品はコストになる。
  ticket: { kind: billing, voice: 請求書に見慣れない項目が増えていました。これは何に効いているんでしょう？ }
  review: { status: draft }
- id: db-exposed
  conceptId: rds-network-isolation
  tone: bad
  headline: データベースにインターネットから届く状態で、住所と電話番号が漏れた
  explanation: パブリックアクセスを有効にし、セキュリティグループでどこからの接続も許可していると、データベースにインターネットから直接届きます。データベースはプライベートサブネットに置き、接続元をWebサーバーのセキュリティグループだけに絞ります。
  examPoint: 「データベースはインターネットから到達できないこと」には、プライベートサブネットへの配置と、セキュリティグループで接続元を絞る構成。
  ticket: { kind: security, voice: お客さんの住所と電話番号が漏れました。一軒ずつお詫びに回っています }
  review: { status: draft }
- id: db-private
  conceptId: rds-network-isolation
  tone: good
  headline: データベースには外から届かず、不審なアクセスは何も得られなかった
  explanation: パブリックアクセスを無効にするか、セキュリティグループで接続元をWebサーバーだけに絞っていたので、インターネットからの接続は届きませんでした。両方とも閉じておくのが基本です。
  examPoint: セキュリティグループの接続元には、IPアドレスの範囲だけでなく、別のセキュリティグループも指定できる。
  review: { status: draft }
