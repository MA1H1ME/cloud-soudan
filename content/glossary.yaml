# 用語図鑑。ゲーム中の用語をタップすると出る説明。
# short：ひとことで言うと何か（ゲーム内の言い換え）。body：公式ドキュメントと照合した説明。
# play：ゲームの中での役割（ゲーム内の値の話。照合の対象外）。
- id: region
  term: リージョン
  short: AWS のデータセンターがある地域
  body: AWS のサービスは世界の複数の地域（リージョン）で動いています。リージョンどうしは互いに切り離されていて、リソースはリージョンをまたいで自動では複製されません。
  play: すべての構成を1つのリージョンの中に組みます。
  sources:
    - { title: 'Regions and Zones', url: 'https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-regions-availability-zones.html', checkedAt: '2026-11-16' }
  review: { status: verified, verifiedAt: '2026-11-16' }
- id: az
  term: アベイラビリティーゾーン（AZ）
  short: リージョンの中にある、互いに独立した場所
  body: アベイラビリティーゾーン（AZ）は、1つのリージョンの中にある、互いに切り離された複数の場所です。EC2 インスタンスを複数のAZに起動しておくと、1か所の障害からアプリケーションを守れます。
  play: 設計図の左の列が AZ-a、右の列が AZ-c です。両方に置くと、片方の障害に耐えられます。
  sources:
    - { title: 'Regions and Zones', url: 'https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-regions-availability-zones.html', checkedAt: '2026-11-16' }
  review: { status: verified, verifiedAt: '2026-11-16' }
- id: subnet
  term: パブリック／プライベートサブネット
  short: ネットワークを区切った区画。外とつながるかどうかで2種類
  body: パブリックサブネットは、インターネットゲートウェイへの直接の経路を持ち、中のリソースはインターネットにつながれます。プライベートサブネットはその経路を持ちません。AWS のリソースを守るために、プライベートサブネットを使うことが推奨されています。
  play: 設計図の上の段がパブリック、中段と下段がプライベートです。データベースは下段に置きます。
  sources:
    - { title: 'Subnets for your VPC', url: 'https://docs.aws.amazon.com/vpc/latest/userguide/configure-subnets.html', checkedAt: '2026-11-16' }
  review: { status: verified, verifiedAt: '2026-11-16' }
- id: security-group
  term: セキュリティグループ
  short: サーバーやデータベースの前に置く、通信の門番
  body: セキュリティグループは仮想ファイアウォールとして働きます。インスタンスに届くのは、セキュリティグループのルールで許可した通信だけです。接続元には、IPアドレスの範囲のほかに、別のセキュリティグループも指定できます。
  play: 構築画面のRDSの「接続」で、接続元を「Webサーバーだけ」にできます。
  sources:
    - { title: 'Control traffic to your AWS resources using security groups', url: 'https://docs.aws.amazon.com/vpc/latest/userguide/vpc-security-groups.html', checkedAt: '2026-11-16' }
    - { title: 'Security group rules', url: 'https://docs.aws.amazon.com/vpc/latest/userguide/security-group-rules.html', checkedAt: '2026-11-16' }
  review: { status: verified, verifiedAt: '2026-11-16' }
- id: ec2
  term: Amazon EC2
  short: クラウド上の仮想サーバー
  body: Amazon EC2 は、AWS クラウド上の仮想サーバー（インスタンス）を、必要な数だけ起動できるサービスです。アクセスの急増などで負荷が増えれば能力を足し、減れば戻せます。
  play: Webサーバー1台にあたります。1台で1日1,500訪問をさばけます（ゲーム内の値）。
  sources:
    - { title: 'What is Amazon EC2?', url: 'https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/concepts.html', checkedAt: '2026-11-16' }
  review: { status: verified, verifiedAt: '2026-11-16' }
- id: alb
  term: ALB（Application Load Balancer）
  short: アクセスを複数のサーバーに振り分ける装置
  body: Elastic Load Balancing は、届いた通信を複数のターゲット（EC2 インスタンスなど）に自動で振り分けます。1つ以上のAZにまたがって使え、ヘルスチェックで正常なターゲットにだけ通信を送ります。Application Load Balancer は、その種類の1つです。
  play: サーバーを2台にするなら必要です。ALB がないと、2台目は使われません。
  sources:
    - { title: 'What is Elastic Load Balancing?', url: 'https://docs.aws.amazon.com/elasticloadbalancing/latest/userguide/what-is-load-balancing.html', checkedAt: '2026-11-16' }
  review: { status: verified, verifiedAt: '2026-11-16' }
- id: auto-scaling
  term: Amazon EC2 Auto Scaling
  short: 混んだときだけサーバーを自動で増やす仕組み
  body: Amazon EC2 Auto Scaling は、アプリケーションの負荷に見合う数の EC2 インスタンスを保つ仕組みです。最小と最大の台数を決めておくと、その範囲の中で、スケーリングポリシーに従って台数を増減します。
  play: 混んだ日だけ最大2台を足します。足した分は、使った日数だけ料金がかかります。
  sources:
    - { title: 'What is Amazon EC2 Auto Scaling?', url: 'https://docs.aws.amazon.com/autoscaling/ec2/userguide/what-is-amazon-ec2-auto-scaling.html', checkedAt: '2026-11-16' }
  review: { status: verified, verifiedAt: '2026-11-16' }
- id: rds
  term: Amazon RDS
  short: AWS が面倒を見てくれるデータベース
  body: Amazon RDS は、AWS クラウドでリレーショナルデータベースを用意・運用・拡張しやすくするマネージドサービスです。よくあるデータベース管理の作業を引き受けます。
  play: 注文や予約の記録が入る、構成の心臓部です。外せません。
  sources:
    - { title: 'What is Amazon Relational Database Service (Amazon RDS)?', url: 'https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Welcome.html', checkedAt: '2026-11-16' }
  review: { status: verified, verifiedAt: '2026-11-16' }
- id: rds-backup
  term: 自動バックアップ（RDS）
  short: データベースを過去の時点に戻すための保存
  body: 自動バックアップを有効にすると、保持期間内の任意の時点にデータベースを復元できます。復元では、新しいDBインスタンスが作られます。保持期間を0にすると、自動バックアップは無効になります。
  play: データを失わずに済みますが、戻すまでの間はサイトが止まります。
  sources:
    - { title: 'Introduction to backups', url: 'https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_WorkingWithAutomatedBackups.html', checkedAt: '2026-11-16' }
    - { title: 'Restoring a DB instance to a specified time for Amazon RDS', url: 'https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_PIT.html', checkedAt: '2026-11-16' }
  review: { status: verified, verifiedAt: '2026-11-16' }
- id: multi-az
  term: マルチAZ配置（RDS）
  short: 別のAZに待機系を置き、障害のとき自動で切り替える
  body: マルチ AZ DB インスタンスでは、別のアベイラビリティーゾーンに待機系（スタンバイ）が置かれ、本体から同期的に複製されます。本体に障害が起きると、自動で待機系に切り替わります。待機系を読み取りに使うことはできません。
  play: 設計図の右下に「スタンバイ」を置くと、マルチAZ配置になります。
  sources:
    - { title: 'Multi-AZ DB instance deployments for Amazon RDS', url: 'https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZSingleStandby.html', checkedAt: '2026-11-16' }
  review: { status: verified, verifiedAt: '2026-11-16' }
- id: read-replica
  term: リードレプリカ（RDS）
  short: 読み取り専用の複製。読み込みの負荷を分ける
  body: リードレプリカは、読み取りの多い負荷を分散するためのものです。本体の更新は非同期でレプリカに複製されます。本体が止まったときに復旧に使うこともできますが、その場合は自分でレプリカを昇格させ、接続先を切り替える必要があります。
  play: マルチAZのスタンバイと見た目は似ていますが、自動では切り替わりません。
  sources:
    - { title: 'Working with DB instance read replicas', url: 'https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.html', checkedAt: '2026-11-16' }
    - { title: 'Promoting a read replica to be a standalone DB instance', url: 'https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.Promote.html', checkedAt: '2026-11-16' }
  review: { status: verified, verifiedAt: '2026-11-16' }
- id: s3
  term: Amazon S3
  short: ファイルを置いておくクラウドの倉庫
  body: Amazon S3 はオブジェクトストレージのサービスです。ファイル（オブジェクト）をバケットに入れて保存します。バケットとオブジェクトは、デフォルトでは公開されません。ブロックパブリックアクセスは、ポリシーやアクセス許可より優先して公開を制限します。
  play: 検査結果のPDFや、ブログの写真を置きます。
  sources:
    - { title: 'What is Amazon S3?', url: 'https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html', checkedAt: '2026-11-16' }
    - { title: 'Blocking public access to your Amazon S3 storage', url: 'https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-control-block-public-access.html', checkedAt: '2026-11-16' }
  review: { status: verified, verifiedAt: '2026-11-16' }
- id: presigned-url
  term: 署名付きURL（S3）
  short: 期限つきで、非公開のファイルを渡すためのURL
  body: 署名付きURLは、認証情報を使って、オブジェクトをダウンロードする期限つきの許可を与えます。バケットを公開しなくても、特定の人にファイルを渡せます。
  play: 患者さん本人にだけ検査結果を渡すときに使います。
  sources:
    - { title: 'Sharing objects with presigned URLs', url: 'https://docs.aws.amazon.com/AmazonS3/latest/userguide/ShareObjectPreSignedURL.html', checkedAt: '2026-11-16' }
  review: { status: verified, verifiedAt: '2026-11-16' }
- id: lifecycle
  term: S3 ライフサイクル
  short: 古いファイルを安い保存先に自動で移すルール
  body: S3 ライフサイクルは、オブジェクトをより低コストのストレージクラスへ移行したり、期限切れのオブジェクトを削除したりして、費用を抑えて保存するのに役立ちます。S3 標準 – IA は、長く保存し、アクセス頻度の低いデータ向けのストレージクラスです。
  play: 写真が毎月増えるお客さんで効いてきます。
  sources:
    - { title: 'Managing the lifecycle of objects', url: 'https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lifecycle-mgmt.html', checkedAt: '2026-11-16' }
    - { title: 'Understanding and managing Amazon S3 storage classes', url: 'https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html', checkedAt: '2026-11-16' }
  review: { status: verified, verifiedAt: '2026-11-16' }
- id: cloudfront
  term: Amazon CloudFront
  short: 世界中の拠点からサイトを速く届ける仕組み
  body: Amazon CloudFront は、HTML、CSS、画像などのコンテンツをユーザーに速く届けるサービスです。エッジロケーションと呼ぶ世界中のデータセンターから配信し、エッジに無いものは、S3 バケットなどのオリジンから取ってきます。
  play: 静的サイトを S3 に置いたまま、HTTPS で速く配信できます。
  sources:
    - { title: 'What is Amazon CloudFront?', url: 'https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Introduction.html', checkedAt: '2026-11-16' }
  review: { status: verified, verifiedAt: '2026-11-16' }
- id: iam-role
  term: IAM ロール
  short: サーバーに渡す、一時的な権限
  body: EC2 に IAM ロールを割り当てると、アプリケーションは一時的な認証情報を受け取って使えます。IAMユーザーの長期の認証情報（アクセスキー）を配る必要がありません。権限は、作業に必要な分だけを与えます（最小権限）。
  play: 構築画面の IAM タブで選びます。アクセスキーをサーバーに置くのは避けます。
  sources:
    - { title: 'IAM roles for Amazon EC2', url: 'https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/iam-roles-for-amazon-ec2.html', checkedAt: '2026-11-16' }
    - { title: 'Security best practices in IAM', url: 'https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html', checkedAt: '2026-11-16' }
  review: { status: verified, verifiedAt: '2026-11-16' }
- id: rds-encryption
  term: 保管時の暗号化（RDS）
  short: 保存してあるデータを、暗号にして守る設定
  body: Amazon RDS の暗号化したDBインスタンスは、AES-256 で保存データを暗号化します。基盤のストレージ、ログ、自動バックアップ、リードレプリカ、スナップショットが暗号化され、保存時の暗号化の要件を満たすのに使えます。暗号化したインスタンスの KMS キーは、作成後に変更できません。
  play: 構築画面の RDS の「暗号化」で有効にします。通信の暗号化（HTTPS）とは別の話です。
  sources:
    - { title: 'Encrypting Amazon RDS resources', url: 'https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Overview.Encryption.html', checkedAt: '2026-11-17' }
  review: { status: verified, verifiedAt: '2026-11-17' }
- id: nat-gateway
  term: NAT ゲートウェイ
  short: プライベートサブネットのサーバーが、外へ出るための出口
  body: NAT ゲートウェイを使うと、プライベートサブネットのインスタンスは VPC の外のサービスに接続できますが、外のサービスからそのインスタンスへ接続を始めることはできません。パブリック NAT ゲートウェイはパブリックサブネットに作り、作成時に Elastic IP アドレスを関連付けます。
  play: 設計図の画面で置けます。サーバーが OS の更新を取りに行くときに要ります。
  sources:
    - { title: 'NAT gateways', url: 'https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-gateway.html', checkedAt: '2026-11-18' }
  review: { status: verified, verifiedAt: '2026-11-18' }
